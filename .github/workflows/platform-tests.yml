name: Platform tests
on:
  pull_request:
    paths: ['Backend/**', 'Frontend/**', '.github/workflows/platform-tests.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    name: Backend (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, legacy]
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = platform ]; then
            python -m pytest tests/platform -ra --junitxml=test-results/platform.xml
          else
            python -m pytest tests/unit tests/integration -ra --junitxml=test-results/legacy.xml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.suite }}-results
          path: Backend/test-results/
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            Frontend/playwright-report/
            Frontend/test-results/
